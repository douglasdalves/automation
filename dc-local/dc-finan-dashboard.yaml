name: finance-dashboard
services:
  finance-api:
    image: python:3.13-alpine
    container_name: dc-finance-api
    working_dir: /app
    command:
      - python3
      - finance_app_server.py
    hostname: dc-finance-api
    restart: unless-stopped
    environment:
      FINANCE_DB_PATH: /data/finance.db
    expose:
      - "8001"
    volumes:
      - type: bind
        source: /home/dalves/automation/configs-apps/app-finance-sync
        target: /app
      - type: volume
        source: finance_data
        target: /data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8001/api/data"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    privileged: false
    x-casaos:
      volumes:
        - container: /app
          description:
            en_us: ""

  finance-dashboard:
    image: nginx:1.27-alpine
    container_name: dc-finance-dash
    command:
      - sh
      - -c
      - |
        mkdir -p /etc/nginx/conf.d && \
        cp /tmp/nginx.conf /etc/nginx/nginx.conf && \
        nginx -g 'daemon off;'
    hostname: dc-finance-dash
    restart: unless-stopped
    ports:
      - target: 80
        published: "8085"
        protocol: tcp
    volumes:
      - type: bind
        source: /home/dalves/automation/configs-apps/app-finance-sync
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /home/dalves/automation/configs-apps/app-finance-sync/nginx.conf
        target: /tmp/nginx.conf
        read_only: true
    depends_on:
      finance-api:
        condition: service_healthy
    privileged: false
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: ""
      volumes:
        - container: /usr/share/nginx/html
          description:
            en_us: ""
        - container: /tmp/nginx.conf
          description:
            en_us: ""

volumes:
  finance_data:

x-casaos:
  architectures:
    - arm64
  author: CasaOS User
  category: unknown
  description:
    en_us: ""
  developer: unknown
  hostname: aphome201.local
  icon: ""
  image: null
  index: ""
  is_uncontrolled: false
  main: finance-dashboard
  port_map: "8085"
  scheme: http
  store_app_id: finance-dashboard
  tagline:
    en_us: This is a compose app converted from a legacy app (CasaOS v0.4.3 or
      earlier)
  thumbnail: ""
  tips:
    custom: This is a compose app converted from a legacy app (CasaOS v0.4.3 or
      earlier)
  title:
    custom: ""
    en_us: finance-dashboard