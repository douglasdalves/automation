#!/bin/bash
# Configuração centralizada do Telegram Bot
# Atualize esses valores com seus dados reais

# Nomes padrão
export BOT_TOKEN="${BOT_TOKEN:-id_do_token}"
export CHAT_ID="${CHAT_ID:-id_do_chat}"

# Compatibilidade com nomes legados (usados por alguns scripts)
export TELEGRAM_TOKEN="$BOT_TOKEN"
export TELEGRAM_CHAT_ID="$CHAT_ID"