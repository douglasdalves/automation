name: CI - Validação de Código Python

# O fluxo roda a cada push ou Pull Request nas branches main e develop
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
    # 1. Baixa o código do seu repositório para o servidor do GitHub
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Verifica sintaxe em todas as versões declaradas como suportadas
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verificar sintaxe Python
      run: python -m compileall -q homelab-mcp homelab-telegram-bot configs-apps/app-finance-sync

    - name: Rodar Linter (Ruff)
      run: |
        pip install ruff
        # O comando abaixo avisa erros críticos e formatações incorretas
        ruff check --output-format=github .
        
    # 4. Instala e roda o mypy (Verificador de tipos)
    - name: Run mypy
      run: |
        pip install mypy==1.14.1
        mypy . --ignore-missing-imports